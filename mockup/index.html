<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTT — Change Tracking Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --br:#c4161c;--brdk:#9b1117;--brlt:#fee2e2;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;
  --s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;
  --s800:#1e293b;--s900:#0f172a;
  --em:#10b981;--bl:#3b82f6;--am:#f59e0b;--ro:#f43f5e;--in:#6366f1;--vi:#8b5cf6;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--s100);color:var(--s900);line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow:hidden}

/* ── PAGE SYSTEM ── */
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
#pg-login.active{display:flex}

/* ══════════════════════════════
   LOGIN
══════════════════════════════ */
#pg-login{background:var(--s900);align-items:center;justify-content:center;overflow:hidden}
#c3{position:absolute;inset:0;opacity:.5}
.l-noise{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");pointer-events:none}
.l-glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(196,22,28,.2) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none}
.lcard{position:relative;z-index:10;width:400px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:44px;backdrop-filter:blur(28px);box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.l-brand{display:flex;align-items:center;gap:12px;margin-bottom:38px}
.l-icon{width:38px;height:38px;background:var(--br);border-radius:10px;display:grid;place-items:center}
.l-icon svg{width:19px;height:19px}
.l-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.01em}
.l-sub{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.l-h{font-size:25px;font-weight:700;color:#fff;letter-spacing:-.03em;margin-bottom:5px}
.l-p{font-size:13px;color:rgba(255,255,255,.38);margin-bottom:30px}
.lbl{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.inp{width:100%;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:rgba(255,255,255,.18)}
.inp:focus{border-color:rgba(196,22,28,.5);box-shadow:0 0 0 3px rgba(196,22,28,.1)}
.fg{margin-bottom:16px}
.lbtn{width:100%;padding:12px;background:var(--br);border:none;border-radius:10px;font-size:13.5px;font-weight:600;font-family:inherit;color:#fff;cursor:pointer;margin-top:8px;transition:background .15s,transform .12s,box-shadow .15s;box-shadow:0 4px 18px rgba(196,22,28,.38);letter-spacing:-.01em}
.lbtn:hover{background:var(--brdk);transform:translateY(-1px);box-shadow:0 8px 24px rgba(196,22,28,.45)}
.lbtn:active{transform:translateY(0)}
.l-hint{margin-top:18px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.18)}
.l-hint span{color:rgba(255,255,255,.4)}
.dpills{display:flex;gap:6px;margin-top:22px;border-top:1px solid rgba(255,255,255,.06);padding-top:18px}
.dp{flex:1;padding:7px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.32);cursor:pointer;transition:all .15s}
.dp:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.68);border-color:rgba(255,255,255,.14)}
.dp .dr{display:block;font-size:9.5px;color:rgba(255,255,255,.2);margin-top:1px}

/* ══════════════════════════════
   APP SHELL
══════════════════════════════ */
#pg-app.active{display:flex;flex-direction:column}

/* TOP NAV */
.topnav{height:58px;flex-shrink:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--s200);display:flex;align-items:center;padding:0 24px;gap:0;position:sticky;top:0;z-index:50}
.tn-logo{display:flex;align-items:center;gap:9px;margin-right:28px;cursor:pointer;user-select:none}
.tn-logo-box{width:30px;height:30px;background:var(--br);border-radius:7px;display:grid;place-items:center;transition:background .15s}
.tn-logo-box:hover{background:var(--brdk)}
.tn-logo-box svg{width:15px;height:15px}
.tn-logo-text{font-size:14px;font-weight:700;color:var(--s900);letter-spacing:-.01em}
.tn-nav{display:flex;align-items:center;gap:2px;flex:1}
.tn-item{padding:7px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--s500);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.tn-item:hover{color:var(--s800);background:var(--s50)}
.tn-item.active{color:var(--br);background:var(--brlt);font-weight:600}
.tn-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tn-bell{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;transition:background .15s;position:relative;border:1px solid var(--s200)}
.tn-bell:hover{background:var(--s50)}
.tn-bell svg{width:15px;height:15px;stroke:var(--s500)}
.tn-bell-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;background:var(--br);border-radius:50%;border:2px solid #fff}
.tn-div{width:1px;height:20px;background:var(--s200)}
.tn-user{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.tn-user:hover{background:var(--s50)}
.tn-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--br) 0%,#7c0e12 100%);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.tn-uname{font-size:12.5px;font-weight:600;color:var(--s800)}
.tn-urole{font-size:10.5px;color:var(--s400)}
.env-pill{padding:3px 8px;background:#fef9c3;border:1px solid #fde047;border-radius:5px;font-size:10px;font-weight:600;color:#713f12;letter-spacing:.04em}

/* SCROLLABLE BODY */
.app-body{flex:1;overflow-y:auto;padding:28px 24px;min-height:0}
.app-body::-webkit-scrollbar{width:5px}
.app-body::-webkit-scrollbar-thumb{background:var(--s200);border-radius:3px}

/* ══════════════════════════════
   HERO SECTION
══════════════════════════════ */
.hero{
  background:var(--s900);
  border-radius:18px;
  padding:32px 36px 28px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
/* subtle dot-grid texture */
.hero::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
}
/* red glow corner */
.hero::after{
  content:'';position:absolute;
  bottom:-80px;right:-80px;
  width:360px;height:360px;
  background:radial-gradient(circle,rgba(196,22,28,.14) 0%,transparent 65%);
  pointer-events:none;
}

.hero-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:28px;position:relative;z-index:1;
}
.hero-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-bottom:5px;
}
.hero-sprint{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.02em}
.hero-date{font-size:12px;color:rgba(255,255,255,.35);margin-top:3px}

.hero-countdown{text-align:right}
.hc-val{
  font-size:44px;font-weight:900;color:#fff;
  letter-spacing:-.06em;line-height:1;
}
.hc-lbl{font-size:11px;color:rgba(255,255,255,.35);text-align:right;margin-top:2px}

/* BIG METRIC + PRODUCT RINGS */
.hero-mid{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:22px;position:relative;z-index:1;
}
.hero-pct-block{}
.hero-pct{
  font-size:clamp(80px,9vw,110px);
  font-weight:900;color:#fff;
  letter-spacing:-.06em;line-height:.9;
  display:flex;align-items:baseline;gap:6px;
}
.hero-pct-sym{
  font-size:clamp(28px,3.5vw,40px);
  font-weight:700;color:rgba(255,255,255,.55);
  letter-spacing:-.03em;
}
.hero-pct-lbl{
  font-size:12px;font-weight:500;color:rgba(255,255,255,.4);
  margin-top:8px;letter-spacing:.01em;
}

/* Product ring pills */
.hero-rings{display:flex;gap:10px;align-items:flex-end}
.hring-pill{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:background .15s,border-color .15s;
  min-width:150px;
}
.hring-pill:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14)}
.hring-svg{position:relative;flex-shrink:0}
.hring-svg svg{display:block}
.hring-num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:14px;font-weight:800;color:#fff;
}
.hring-info{}
.hring-code{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px}
.hring-name{font-size:12px;font-weight:600;color:#fff;letter-spacing:-.01em}
.hring-sub{font-size:10.5px;color:rgba(255,255,255,.35);margin-top:1px}

/* PROGRESS BAR */
.hero-bar-wrap{position:relative;z-index:1;margin-bottom:14px}
.hero-bar{
  display:flex;height:8px;border-radius:5px;overflow:hidden;
  gap:2px;background:rgba(255,255,255,.07);
}
.hbar-seg{height:100%;border-radius:3px}

/* LEGEND */
.hero-legend{
  display:flex;flex-wrap:wrap;gap:20px;
  position:relative;z-index:1;
}
.hl-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.4)}
.hl-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.hl-item strong{color:rgba(255,255,255,.8);font-weight:700;margin-left:2px}

/* ══════════════════════════════
   DASHBOARD BOTTOM (2-col)
══════════════════════════════ */
.dash-grid{display:grid;grid-template-columns:1fr 308px;gap:16px}

/* SECTION HEADER */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h-left{display:flex;align-items:center;gap:8px}
.sec-title{font-size:13px;font-weight:700;color:var(--s900);letter-spacing:-.01em}
.sec-badge{font-size:10.5px;font-weight:600;color:var(--s400);background:var(--s100);padding:2px 8px;border-radius:20px}
.sec-link{font-size:12px;font-weight:500;color:var(--s400);cursor:pointer;transition:color .15s;user-select:none}
.sec-link:hover{color:var(--s600)}

/* FILTERS */
.fbar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.fsel{border:1px solid var(--s200);border-radius:7px;padding:6px 10px;font-size:12px;font-family:inherit;color:var(--s600);background:#fff;cursor:pointer;outline:none;transition:border-color .15s}
.fsel:hover{border-color:var(--s300)}

/* TASK CARDS — production-faithful, elevated */
.tc{
  background:#fff;border:1px solid var(--s200);border-radius:11px;
  padding:14px 16px;margin-bottom:9px;
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:box-shadow .2s,border-color .2s,transform .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.tc:hover{
  box-shadow:0 6px 22px rgba(0,0,0,.08);
  border-color:var(--s300);
  transform:translateY(-1px);
}
.tc-bar{position:absolute;top:0;left:0;right:0;height:3px}
.tc-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
.tc-title{font-size:13px;font-weight:600;color:var(--s900);flex:1;line-height:1.35}
.tc-desc{font-size:11.5px;color:var(--s500);margin-bottom:8px;line-height:1.4}
.tc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.tc-foot{border-top:1px solid var(--s100);padding-top:8px;display:flex;align-items:center;justify-content:space-between}
.tc-left{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--s600)}
.tc-av{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.tc-right{display:flex;align-items:center;gap:5px;font-size:11.5px}
.overdue{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--ro);background:#fee2e2;padding:2px 6px;border-radius:20px}
.jira-pill{font-size:9.5px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:2px 6px;border-radius:4px}
.view-all{width:100%;padding:10px;border:1.5px dashed var(--s200);border-radius:10px;background:transparent;font-size:12px;font-weight:500;color:var(--s400);cursor:pointer;transition:all .15s;font-family:inherit;margin-top:2px}
.view-all:hover{background:var(--s50);color:var(--s600);border-color:var(--s300)}

/* STATUS & PRIORITY BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.bdg-dot{width:5px;height:5px;border-radius:50%}
.bPASSED{background:#d1fae5;color:#065f46}.bPASSED .bdg-dot{background:var(--em)}
.bFAILED{background:#fee2e2;color:#991b1b}.bFAILED .bdg-dot{background:var(--ro)}
.bBLOCKED{background:#fef3c7;color:#92400e}.bBLOCKED .bdg-dot{background:var(--am)}
.bIN_PROGRESS{background:#dbeafe;color:#1e40af}.bIN_PROGRESS .bdg-dot{background:var(--bl)}
.bREADY{background:var(--s100);color:var(--s500)}.bREADY .bdg-dot{background:var(--s400)}
.bDEPLOYED{background:#e0e7ff;color:#3730a3}.bDEPLOYED .bdg-dot{background:var(--in)}
.pH{background:#fee2e2;color:#991b1b}
.pM{background:#fef3c7;color:#92400e}
.pL{background:var(--s100);color:var(--s500)}
.bmod{background:#eef2ff;color:#3730a3;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.bprod{background:#ecfdf5;color:#065f46;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.ctry{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.02em}
.cMY{background:#dbeafe;color:#1e40af}.cSG{background:#cffafe;color:#155e75}
.cTH{background:#fce7f3;color:#9d174d}.cVN{background:#fef9c3;color:#713f12}
.cTW{background:#d1fae5;color:#065f46}.cHK{background:#fee2e2;color:#991b1b}

/* RIGHT COLUMN */
.rcard{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.act-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--s50);align-items:flex-start}
.act-item:last-child{border-bottom:none;padding-bottom:0}
.act-ico{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.act-ico svg{width:13px;height:13px}
.ai-s{background:#d1fae5}.ai-s svg{stroke:var(--em)}
.ai-b{background:#fef3c7}.ai-b svg{stroke:var(--am)}
.ai-c{background:#dbeafe}.ai-c svg{stroke:var(--bl)}
.ai-f{background:#fee2e2}.ai-f svg{stroke:var(--ro)}
.ai-x{background:#e0e7ff}.ai-x svg{stroke:var(--in)}
.act-body .at{font-size:11.5px;color:var(--s600);line-height:1.45}
.act-body .at strong{color:var(--s900);font-weight:600}
.act-body .atm{font-size:10px;color:var(--s400);margin-top:2px}
.ci-row{display:flex;gap:8px;padding:9px 10px;background:#fff8f8;border:1px solid #fee2e2;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:background .15s;align-items:flex-start}
.ci-row:last-child{margin-bottom:0}
.ci-row:hover{background:#fee2e2}
.ci-row svg{width:13px;height:13px;stroke:var(--ro);flex-shrink:0;margin-top:1px}
.ci-t{font-size:11.5px;font-weight:600;color:#991b1b;line-height:1.3}
.ci-m{font-size:10px;color:#dc2626;margin-top:2px}
</style>
</head>
<body>

<!-- ════════════════ LOGIN ════════════════ -->
<div id="pg-login" class="page active">
  <canvas id="c3"></canvas>
  <div class="l-noise"></div>
  <div class="l-glow"></div>
  <div class="lcard" id="lcard">
    <div class="l-brand">
      <div class="l-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="9" height="2" rx="1" fill="white"/><rect x="2" y="8" width="13" height="2" rx="1" fill="white"/><rect x="2" y="13" width="7" height="2" rx="1" fill="white"/><polyline points="12,10 14.5,13 18.5,8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="l-name">CTT</div><div class="l-sub">DKSH Change Tracking</div></div>
    </div>
    <h1 class="l-h">Welcome back</h1>
    <p class="l-p">Sign in to track UAT &amp; SIT across markets</p>
    <div class="fg"><label class="lbl">Email address</label><input class="inp" type="email" value="putra.mahirudin@dksh.com"></div>
    <div class="fg"><label class="lbl">Password</label><input class="inp" type="password" value="••••••••••"></div>
    <button class="lbtn" onclick="enterApp('admin')">Sign in to CTT</button>
    <div class="dpills">
      <div class="dp" onclick="enterApp('admin')">Putra M.<span class="dr">Admin</span></div>
      <div class="dp" onclick="enterApp('stakeholder')">UAT MY<span class="dr">Stakeholder</span></div>
      <div class="dp" onclick="enterApp('qa')">QA EO<span class="dr">QA</span></div>
    </div>
    <p class="l-hint">v1.4.2 · <span>Staging environment</span></p>
  </div>
</div>

<!-- ════════════════ APP ════════════════ -->
<div id="pg-app" class="page">
  <nav class="topnav">
    <div class="tn-logo" onclick="navTo('admin-dashboard')">
      <div class="tn-logo-box"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="9" height="2" rx="1" fill="white"/><rect x="2" y="8" width="13" height="2" rx="1" fill="white"/><rect x="2" y="13" width="7" height="2" rx="1" fill="white"/><polyline points="12,10 14.5,13 18.5,8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="tn-logo-text">CTT</span>
    </div>
    <div class="tn-nav" id="tn-nav"></div>
    <div class="tn-right">
      <div class="env-pill">Staging</div>
      <div class="tn-bell"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div class="tn-bell-dot"></div></div>
      <div class="tn-div"></div>
      <div class="tn-user" onclick="cycleRole()" title="Click to switch role">
        <div class="tn-avatar" id="ua">PM</div>
        <div><div class="tn-uname" id="un">Putra Mahirudin</div><div class="tn-urole" id="ur">Administrator</div></div>
      </div>
    </div>
  </nav>
  <div class="app-body" id="app-body"></div>
</div>

<!-- ════════════════ ADMIN DASHBOARD TEMPLATE ════════════════ -->
<template id="t-admin-dashboard">
<div>
  <!-- ── HERO ── -->
  <div class="hero">

// ── THREE.JS LOGIN ─────────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('c3');
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,100);
  cam.position.z=28;
  const N=75,p=[],v=[];
  const pa=new Float32Array(N*3);
  for(let i=0;i<N;i++){p.push({x:(Math.random()-.5)*56,y:(Math.random()-.5)*38,z:(Math.random()-.5)*8});v.push({x:(Math.random()-.5)*.038,y:(Math.random()-.5)*.038});}
  const pg=new THREE.BufferGeometry();
  sc.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xc4161c,size:.22,transparent:true,opacity:.75})));
  const la=new Float32Array(N*N*6),lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(la,3));
  sc.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xc4161c,transparent:true,opacity:.11})));
  let m={x:0,y:0};
  window.addEventListener('mousemove',e=>{m.x=(e.clientX/innerWidth-.5)*.4;m.y=(e.clientY/innerHeight-.5)*.4;});
  function rsz(){r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
  window.addEventListener('resize',rsz);rsz();
  let lc=0;
  function tick(){
    if(!document.getElementById('pg-login').classList.contains('active'))return;
    requestAnimationFrame(tick);
    cam.position.x+=(m.x*3.5-cam.position.x)*.02;
    cam.position.y+=(-m.y*2.5-cam.position.y)*.02;
    for(let i=0;i<N;i++){
      p[i].x+=v[i].x;p[i].y+=v[i].y;
      if(Math.abs(p[i].x)>30)v[i].x*=-1;if(Math.abs(p[i].y)>20)v[i].y*=-1;
      pa[i*3]=p[i].x;pa[i*3+1]=p[i].y;pa[i*3+2]=p[i].z;
    }
    pg.setAttribute('position',new THREE.BufferAttribute(pa.slice(),3));
    lc=0;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const dx=p[i].x-p[j].x,dy=p[i].y-p[j].y;
      if(dx*dx+dy*dy<169){la[lc++]=p[i].x;la[lc++]=p[i].y;la[lc++]=p[i].z;la[lc++]=p[j].x;la[lc++]=p[j].y;la[lc++]=p[j].z;}
    }
    lg.attributes.position.needsUpdate=true;lg.setDrawRange(0,lc/3);
    r.render(sc,cam);
  }
  tick();
})();

// ── APP STATE ──────────────────────────────────────────────────────────────────

    gsap.fromTo(ap,{opacity:0},{opacity:1,duration:.3});
  }});
}

function navTo(id){
  document.querySelectorAll('.tn-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));

    body.innerHTML=html;
    animateDash();
    gsap.fromTo(body,{opacity:0,y:8},{opacity:1,y:0,duration:.25,ease:'power2.out'});
  }});
}

// ── DASHBOARD ANIMATIONS ───────────────────────────────────────────────────────
function animateDash(){
  // countdown + sprint %
  document.querySelectorAll('[data-count]').forEach(el=>{
    const t=+el.dataset.count;
    gsap.fromTo({v:0},{v:t},{duration:.85,ease:'power2.out',
      onUpdate:function(){el.textContent=Math.round(this.targets()[0].v);},
      onComplete:()=>{el.textContent=t;}});
  });
  // stacked bar
  document.querySelectorAll('.hbar-seg[data-w]').forEach((el,i)=>{
    gsap.fromTo(el,{width:'0%'},{width:el.dataset.w+'%',duration:1.0,ease:'power3.out',delay:.1+i*.04});
  });
  // product rings  r=20, C=2π×20=125.66
  const C=125.66;
  [{id:'hr-eo',num:'hn-eo',pct:74},{id:'hr-sh',num:'hn-sh',pct:61},{id:'hr-sp',num:'hn-sp',pct:88}]
  .forEach((rg,i)=>{
    const el=document.getElementById(rg.id),ne=document.getElementById(rg.num);
    if(!el||!ne)return;
    gsap.fromTo({v:0},{v:rg.pct},{duration:.9,delay:.08+i*.07,ease:'power2.out',
      onUpdate:function(){
        const v=this.targets()[0].v,f=C*(v/100),g=C-f;
        el.setAttribute('stroke-dasharray',`${f} ${g}`);
        ne.textContent=Math.round(v)+'%';
      },onComplete:()=>{
        el.setAttribute('stroke-dasharray',`${C*(rg.pct/100)} ${C*(1-rg.pct/100)}`);
        ne.textContent=rg.pct+'%';
      }
    });
  });
  // task cards stagger
  gsap.fromTo('.tc',{opacity:0,y:8},{opacity:1,y:0,duration:.28,stagger:.055,ease:'power2.out',delay:.18});
  gsap.fromTo('.hring-pill',{opacity:0,y:10},{opacity:1,y:0,duration:.3,stagger:.06,ease:'power2.out',delay:.15});
}
