<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTT — Change Tracking Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:#eef0f7}

/* ── noise util ── */
.noise{position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E")}

/* PAGE SYSTEM */
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
#pg-login.active{display:flex}

/* ═══════════════════════════════════════
   LOGIN
═══════════════════════════════════════ */
#pg-login{
  background:#09090f;
  align-items:center;justify-content:center;overflow:hidden;
}
#c3{position:absolute;inset:0;opacity:.48}
.l-glow-a{position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(196,22,28,.18) 0%,transparent 65%);
  top:50%;left:50%;transform:translate(-55%,-58%);pointer-events:none}
.l-glow-b{position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 65%);
  top:55%;left:60%;transform:translate(-50%,-50%);pointer-events:none}
.lcard{
  position:relative;z-index:10;width:404px;
  background:rgba(255,255,255,.042);
  border:1px solid rgba(255,255,255,.088);
  border-radius:24px;padding:44px;
  backdrop-filter:blur(32px);
  box-shadow:0 48px 120px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
}
.l-brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.l-icon{width:38px;height:38px;
  background:linear-gradient(145deg,#c4161c,#7f0e12);
  border-radius:10px;display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(196,22,28,.4)}
.l-icon svg{width:18px;height:18px}
.l-bname{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.01em}
.l-bsub{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28)}
.l-h{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.04em;margin-bottom:5px}
.l-p{font-size:13px;color:rgba(255,255,255,.36);margin-bottom:28px}
.lbl{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.36);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.inp{width:100%;background:rgba(255,255,255,.052);border:1px solid rgba(255,255,255,.09);
  border-radius:11px;padding:11px 14px;font-size:14px;font-family:inherit;color:#fff;outline:none;
  transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:rgba(255,255,255,.16)}
.inp:focus{border-color:rgba(196,22,28,.45);box-shadow:0 0 0 3px rgba(196,22,28,.1)}
.fg{margin-bottom:16px}
.lbtn{width:100%;padding:12px;
  background:linear-gradient(145deg,#c4161c,#9b1117);
  border:none;border-radius:11px;font-size:13.5px;font-weight:600;font-family:inherit;color:#fff;cursor:pointer;
  margin-top:8px;transition:opacity .15s,transform .12s,box-shadow .15s;
  box-shadow:0 4px 20px rgba(196,22,28,.4)}
.lbtn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 8px 28px rgba(196,22,28,.48)}
.lbtn:active{transform:translateY(0)}
.l-hint{margin-top:16px;text-align:center;font-size:11px;color:rgba(255,255,255,.16)}
.l-hint span{color:rgba(255,255,255,.36)}
.dpills{display:flex;gap:6px;margin-top:20px;border-top:1px solid rgba(255,255,255,.055);padding-top:18px}
.dp{flex:1;padding:7px 8px;background:rgba(255,255,255,.038);
  border:1px solid rgba(255,255,255,.07);border-radius:9px;text-align:center;
  font-size:11px;font-weight:500;color:rgba(255,255,255,.3);cursor:pointer;transition:all .15s}
.dp:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.14)}
.dp-role{display:block;font-size:9.5px;color:rgba(255,255,255,.18);margin-top:1px}

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#pg-app.active{display:flex;flex-direction:column}

/* Body bg — light with very subtle gradient mesh */
.app-body{
  flex:1;overflow-y:auto;
  background:
    radial-gradient(ellipse 80% 60% at 0% 0%, rgba(196,22,28,.04) 0%, transparent 50%),
    radial-gradient(ellipse 60% 60% at 100% 100%, rgba(99,102,241,.04) 0%, transparent 50%),
    linear-gradient(160deg, #edf0f8 0%, #f5f7ff 50%, #eef2f8 100%);
  min-height:0;
}
.app-body::-webkit-scrollbar{width:5px}
.app-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}

/* ── NAV ── */
.nav{
  height:58px;flex-shrink:0;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.07);
  position:sticky;top:0;z-index:50;
}
.nav-inner{
  max-width:1200px;margin:0 auto;padding:0 28px;
  height:100%;display:flex;align-items:center;
}
.nav-logo{display:flex;align-items:center;gap:9px;margin-right:28px;cursor:pointer;user-select:none}
.nav-logo-box{width:30px;height:30px;
  background:linear-gradient(145deg,#c4161c,#800e12);
  border-radius:7px;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(196,22,28,.35)}
.nav-logo-box svg{width:15px;height:15px}
.nav-logo-text{font-size:14px;font-weight:800;color:#0f172a;letter-spacing:-.02em}
.nav-links{display:flex;align-items:center;gap:2px;flex:1}
.nav-item{padding:7px 11px;border-radius:8px;font-size:13px;font-weight:500;
  color:#64748b;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.nav-item:hover{color:#0f172a;background:rgba(0,0,0,.05)}
.nav-item.active{
  color:#c4161c;
  background:linear-gradient(135deg,rgba(196,22,28,.08) 0%,rgba(155,17,23,.05) 100%);
  font-weight:600}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.nav-env{padding:3px 9px;
  background:linear-gradient(135deg,#fef9c3,#fef3c7);
  border:1px solid rgba(234,179,8,.3);
  border-radius:6px;font-size:10px;font-weight:700;color:#854d0e;letter-spacing:.04em}
.nav-bell{width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#fff,#f8fafc);
  border:1px solid rgba(0,0,0,.1);
  display:grid;place-items:center;cursor:pointer;position:relative;
  transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav-bell:hover{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.nav-bell svg{width:15px;height:15px;stroke:#64748b}
.nav-bell-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;
  background:linear-gradient(135deg,#ef4444,#c4161c);border-radius:50%;border:2px solid #fff}
.nav-div{width:1px;height:20px;background:rgba(0,0,0,.1)}
.nav-user{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9px;cursor:pointer;transition:background .15s}
.nav-user:hover{background:rgba(0,0,0,.04)}
.nav-av{width:28px;height:28px;border-radius:50%;
  background:linear-gradient(145deg,#c4161c,#7f0e12);
  display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:0 2px 6px rgba(196,22,28,.3)}
.nav-uname{font-size:12.5px;font-weight:600;color:#1e293b}
.nav-urole{font-size:10.5px;color:#94a3b8}

/* ── CONTENT CONTAINER ── */
.container{max-width:1200px;margin:0 auto;padding:28px 28px 40px}

/* ═══════════════════════════════════════
   HERO (dark, carries login atmosphere)
═══════════════════════════════════════ */
.hero{
  border-radius:20px;
  padding:36px 40px 30px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 65% 100% at 8% 55%,rgba(196,22,28,.16) 0%,transparent 55%),
    radial-gradient(ellipse 50% 70% at 92% 40%,rgba(59,130,246,.1) 0%,transparent 55%),
    radial-gradient(ellipse 35% 50% at 50% 100%,rgba(99,102,241,.07) 0%,transparent 50%),
    linear-gradient(155deg,#0c0c1f 0%,#0f1628 55%,#0b1019 100%);
  box-shadow:0 24px 80px rgba(0,0,0,.28),0 8px 24px rgba(0,0,0,.16);
}
/* subtle dot grid on dark */
.hero::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:30px 30px;pointer-events:none}

/* ── Hero layout: left 55% | right 45% ── */
.hero-layout{display:grid;grid-template-columns:1fr auto;gap:0;position:relative;z-index:1}
.hero-left{}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}

/* hero eyebrow */
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.28);margin-bottom:6px}
.hero-sprint-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;margin-bottom:2px}
.hero-date{font-size:12px;color:rgba(255,255,255,.32);margin-bottom:28px}

/* BIG number */
.hero-big{display:flex;align-items:flex-start;gap:3px;margin-bottom:6px}
.hero-num{
  font-size:clamp(88px,10vw,118px);font-weight:900;line-height:.9;
  letter-spacing:-.06em;
  background:linear-gradient(160deg,#ffffff 30%,rgba(255,255,255,.55) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-pct{
  font-size:clamp(28px,3.5vw,40px);font-weight:700;
  background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-top:12px;letter-spacing:-.02em;
}
.hero-sub{font-size:12px;color:rgba(255,255,255,.32);margin-bottom:24px;letter-spacing:.01em}

/* ── stacked bar ── */
.hero-bar-track{
  display:flex;height:9px;border-radius:6px;overflow:hidden;gap:2px;
  margin-bottom:12px;
  background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
}
.hbs{height:100%;border-radius:3px}
.hbs-em{background:linear-gradient(90deg,#10b981,#34d399)}
.hbs-bl{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.hbs-am{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.hbs-ro{background:linear-gradient(90deg,#f43f5e,#fb7185)}

/* legend */
.hero-legend{display:flex;flex-wrap:wrap;gap:16px}
.hl{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.36)}
.hl-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.hl strong{color:rgba(255,255,255,.72);font-weight:700;margin-left:2px}

/* ── countdown (top-right) ── */
.hero-cd{text-align:right;margin-bottom:24px}
.hero-cd-val{
  font-size:52px;font-weight:900;letter-spacing:-.06em;line-height:1;
  background:linear-gradient(160deg,#ffffff,rgba(255,255,255,.5));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-cd-lbl{font-size:10.5px;color:rgba(255,255,255,.3);text-align:right;margin-top:3px}

/* ── product rings (right column, bottom) ── */
.hero-rings{display:flex;flex-direction:column;gap:8px}
.hring{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:12px 16px;
  cursor:pointer;transition:background .15s,border-color .15s;
  backdrop-filter:blur(10px);
  min-width:186px;
}
.hring:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.15)}
.hring-fig{position:relative;flex-shrink:0}
.hring-fig svg{display:block}
.hring-lbl{position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff}
.hring-info{}
.hring-code{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:1px}
.hring-name{font-size:12px;font-weight:700;color:#fff;letter-spacing:-.01em}
.hring-meta{font-size:10.5px;color:rgba(255,255,255,.32);margin-top:1px}

/* ═══════════════════════════════════════
   BOTTOM GRID
═══════════════════════════════════════ */
.grid-2{display:grid;grid-template-columns:1fr 300px;gap:18px}

/* section header */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-left{display:flex;align-items:center;gap:8px}
.sh-title{font-size:13.5px;font-weight:700;color:#0f172a;letter-spacing:-.02em}
.sh-badge{font-size:10.5px;font-weight:600;color:#94a3b8;
  background:linear-gradient(135deg,rgba(0,0,0,.06),rgba(0,0,0,.04));
  padding:2px 8px;border-radius:20px;border:1px solid rgba(0,0,0,.06)}
.sh-link{font-size:12px;font-weight:500;color:#94a3b8;cursor:pointer;transition:color .15s}
.sh-link:hover{color:#475569}

/* filter bar */
.fbar{display:flex;gap:7px;margin-bottom:12px}
.fsel{
  border:1px solid rgba(0,0,0,.1);border-radius:8px;
  padding:7px 10px;font-size:12px;font-family:inherit;color:#475569;
  background:linear-gradient(135deg,#fff,#f8fafc);cursor:pointer;outline:none;
  transition:border-color .15s,box-shadow .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.fsel:hover{border-color:rgba(0,0,0,.18);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* ── TASK CARD ── */
.tc{
  background:linear-gradient(155deg,#ffffff 0%,#fafdff 100%);
  border-radius:13px;padding:15px 17px;margin-bottom:10px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:box-shadow .2s,transform .18s;
  border:1px solid rgba(0,0,0,.07);
  box-shadow:0 1px 4px rgba(0,0,0,.04),0 0 0 1px rgba(255,255,255,.8) inset;
}
.tc:hover{
  box-shadow:0 8px 30px rgba(0,0,0,.11),0 2px 8px rgba(0,0,0,.06);
  transform:translateY(-1px);
}
/* critical cards get colored ambient shadow */
.tc-critical{
  border-color:rgba(244,63,94,.15);
  box-shadow:0 2px 12px rgba(244,63,94,.1),0 0 0 1px rgba(255,255,255,.8) inset;
}
.tc-critical:hover{box-shadow:0 8px 30px rgba(244,63,94,.15),0 2px 8px rgba(244,63,94,.08);transform:translateY(-1px)}

/* 3px gradient top bar */
.tc-bar{position:absolute;top:0;left:0;right:0;height:3px}

.tc-r1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
.tc-title{font-size:13.5px;font-weight:600;color:#0f172a;flex:1;line-height:1.35}
.tc-desc{font-size:12px;color:#64748b;margin-bottom:8px;line-height:1.45}
.tc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.tc-foot{border-top:1px solid rgba(0,0,0,.05);padding-top:8px;display:flex;align-items:center;justify-content:space-between}
.tc-who{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#475569}
.tc-av{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.tc-when{display:flex;align-items:center;gap:4px;font-size:11.5px}
.overdue{display:inline-flex;align-items:center;gap:2px;font-size:9.5px;font-weight:600;
  color:#dc2626;
  background:linear-gradient(135deg,#fee2e2,#fecaca);
  padding:2px 6px;border-radius:20px;margin-left:4px;
  border:1px solid rgba(220,38,38,.15)}
.jira-tag{font-size:9.5px;font-weight:700;color:#1d4ed8;
  background:linear-gradient(135deg,#dbeafe,#bfdbfe);
  padding:2px 6px;border-radius:4px;border:1px solid rgba(59,130,246,.15)}

.view-all{width:100%;padding:10px;
  border:1.5px dashed rgba(0,0,0,.12);border-radius:11px;
  background:transparent;font-size:12.5px;font-weight:500;color:#94a3b8;
  cursor:pointer;transition:all .15s;font-family:inherit;margin-top:2px}
.view-all:hover{background:rgba(255,255,255,.7);color:#475569;border-color:rgba(0,0,0,.18)}

/* STATUS BADGES — gradient, not flat solid */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;border-width:1px;border-style:solid}
.bdg-dot{width:5px;height:5px;border-radius:50%}
.bPASSED{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;border-color:rgba(16,185,129,.2)}.bPASSED .bdg-dot{background:linear-gradient(135deg,#10b981,#059669)}
.bFAILED{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;border-color:rgba(244,63,94,.2)}.bFAILED .bdg-dot{background:linear-gradient(135deg,#f43f5e,#dc2626)}
.bBLOCKED{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border-color:rgba(245,158,11,.2)}.bBLOCKED .bdg-dot{background:linear-gradient(135deg,#f59e0b,#d97706)}
.bIN_PROGRESS{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;border-color:rgba(59,130,246,.2)}.bIN_PROGRESS .bdg-dot{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.bREADY{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);color:#475569;border-color:rgba(0,0,0,.08)}.bREADY .bdg-dot{background:#94a3b8}
.bDEPLOYED{background:linear-gradient(135deg,#e0e7ff,#c7d2fe);color:#3730a3;border-color:rgba(99,102,241,.2)}.bDEPLOYED .bdg-dot{background:linear-gradient(135deg,#6366f1,#4f46e5)}
.pH{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;border-color:rgba(244,63,94,.15)}
.pM{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border-color:rgba(245,158,11,.15)}
.pL{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);color:#64748b;border-color:rgba(0,0,0,.08)}
.bmod{background:linear-gradient(135deg,#eef2ff,#e0e7ff);color:#3730a3;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;border:1px solid rgba(99,102,241,.15)}
.bprod{background:linear-gradient(135deg,#ecfdf5,#d1fae5);color:#065f46;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;border:1px solid rgba(16,185,129,.15)}

/* Country chips */
.ctry{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.02em;border:1px solid transparent}
.cMY{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;border-color:rgba(59,130,246,.15)}
.cSG{background:linear-gradient(135deg,#cffafe,#a5f3fc);color:#155e75;border-color:rgba(6,182,212,.15)}
.cTH{background:linear-gradient(135deg,#fce7f3,#fbcfe8);color:#9d174d;border-color:rgba(236,72,153,.15)}
.cVN{background:linear-gradient(135deg,#fef9c3,#fef08a);color:#713f12;border-color:rgba(234,179,8,.15)}
.cTW{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;border-color:rgba(16,185,129,.15)}
.cHK{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;border-color:rgba(244,63,94,.15)}

/* ── RIGHT COLUMN CARDS ── */
.rcard{
  background:linear-gradient(155deg,#ffffff,#fafdff);
  border:1px solid rgba(0,0,0,.07);
  border-radius:14px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.04),0 0 0 1px rgba(255,255,255,.8) inset;
}
.act-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.04);align-items:flex-start}
.act-item:last-child{border-bottom:none;padding-bottom:0}

<script>
// ── THREE.JS LOGIN ──────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('c3');
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,100);
  cam.position.z=28;
  const N=75,p=[],v=[];const pa=new Float32Array(N*3);
  for(let i=0;i<N;i++){p.push({x:(Math.random()-.5)*56,y:(Math.random()-.5)*38,z:(Math.random()-.5)*8});v.push({x:(Math.random()-.5)*.038,y:(Math.random()-.5)*.038});}
  const pg=new THREE.BufferGeometry();
  sc.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xc4161c,size:.22,transparent:true,opacity:.75})));
  const la=new Float32Array(N*N*6),lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(la,3));
  sc.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xc4161c,transparent:true,opacity:.11})));
  let m={x:0,y:0};
  window.addEventListener('mousemove',e=>{m.x=(e.clientX/innerWidth-.5)*.4;m.y=(e.clientY/innerHeight-.5)*.4;});
  function rsz(){r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
  window.addEventListener('resize',rsz);rsz();
  let lc=0;
  function tick(){
    if(!document.getElementById('pg-login').classList.contains('active'))return;
    requestAnimationFrame(tick);
    cam.position.x+=(m.x*3.5-cam.position.x)*.02;cam.position.y+=(-m.y*2.5-cam.position.y)*.02;
    for(let i=0;i<N;i++){p[i].x+=v[i].x;p[i].y+=v[i].y;if(Math.abs(p[i].x)>30)v[i].x*=-1;if(Math.abs(p[i].y)>20)v[i].y*=-1;pa[i*3]=p[i].x;pa[i*3+1]=p[i].y;pa[i*3+2]=p[i].z;}
    pg.setAttribute('position',new THREE.BufferAttribute(pa.slice(),3));
    lc=0;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const dx=p[i].x-p[j].x,dy=p[i].y-p[j].y;if(dx*dx+dy*dy<169){la[lc++]=p[i].x;la[lc++]=p[i].y;la[lc++]=p[i].z;la[lc++]=p[j].x;la[lc++]=p[j].y;la[lc++]=p[j].z;}}
    lg.attributes.position.needsUpdate=true;lg.setDrawRange(0,lc/3);r.render(sc,cam);
  }
  tick();
})();

// ── APP ─────────────────────────────────────────────────────────────────────
const ROLES={
  admin:{name:'Putra Mahirudin',initials:'PM',role:'Administrator',nav:['Dashboard','Tasks','JIRA Queue','AI Drafts','Config'],ids:['admin-dashboard','tasks','jira-intake','draft-tasks','database']},
  stakeholder:{name:'Radzwan Noh',initials:'RN',role:'Stakeholder · MY',nav:['Dashboard','Inbox','Knowledge Base'],ids:['stakeholder-dashboard','inbox','knowledge-base']},
  qa:{name:'QA Engineer',initials:'QE',role:'QA · EasyOrder',nav:['QA Dashboard','JIRA Queue','SIT Tasks'],ids:['qa-dashboard','qa-jira','qa-sit']}
};
const rl=['admin','stakeholder','qa'];let ri=0;
function buildNav(role){
  document.getElementById('nav-links').innerHTML=ROLES[role].nav.map((n,i)=>
    `<div class="nav-item" data-id="${ROLES[role].ids[i]}" onclick="navTo('${ROLES[role].ids[i]}')">${n}</div>`).join('');
}
function enterApp(role='admin'){
  ri=rl.indexOf(role);
  const lp=document.getElementById('pg-login'),ap=document.getElementById('pg-app');
  gsap.to(lp,{opacity:0,duration:.4,onComplete:()=>{
    lp.classList.remove('active');ap.classList.add('active');
    const c=ROLES[role];
    document.getElementById('ua').textContent=c.initials;
    document.getElementById('un').textContent=c.name;
    document.getElementById('ur').textContent=c.role;
    buildNav(role);navTo(ROLES[role].ids[0]);
    gsap.fromTo(ap,{opacity:0},{opacity:1,duration:.3});
  }});
}
function cycleRole(){ri=(ri+1)%3;const r=rl[ri];const c=ROLES[r];document.getElementById('ua').textContent=c.initials;document.getElementById('un').textContent=c.name;document.getElementById('ur').textContent=c.role;buildNav(r);navTo(ROLES[r].ids[0]);}
function navTo(id){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  const body=document.getElementById('app-body');
  const tpl=document.getElementById('t-'+id);
  const html=tpl?tpl.innerHTML:`<div class="container"><div style="display:grid;place-items:center;min-height:56vh;text-align:center"><div><div style="font-size:34px;margin-bottom:14px">🚧</div><div style="font-size:15px;font-weight:700;color:#334155;margin-bottom:6px">${id.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</div><div style="font-size:13px;color:#94a3b8">Part of the next batch — currently showing Login &amp; Admin Dashboard.</div></div></div></div>`;
  gsap.to(body,{opacity:0,y:5,duration:.1,onComplete:()=>{
    body.innerHTML=html;anim();
    gsap.fromTo(body,{opacity:0,y:8},{opacity:1,y:0,duration:.25,ease:'power2.out'});
  }});
}
function anim(){
  // counters
  document.querySelectorAll('[data-count]').forEach(el=>{
    const t=+el.dataset.count;
    gsap.fromTo({v:0},{v:t},{duration:.8,ease:'power2.out',onUpdate:function(){el.textContent=Math.round(this.targets()[0].v);},onComplete:()=>{el.textContent=t;}});
  });
  // bar segments
  document.querySelectorAll('.hbs[data-w]').forEach((el,i)=>{
    gsap.fromTo(el,{width:'0%'},{width:el.dataset.w+'%',duration:.95,ease:'power3.out',delay:.1+i*.035});
  });
  // rings  r=18 C=2π×18=113.1
  const C=113.1;
  [{id:'hr-eo',lbl:'hn-eo',pct:74},{id:'hr-sh',lbl:'hn-sh',pct:61},{id:'hr-sp',lbl:'hn-sp',pct:88}]
  .forEach((rg,i)=>{
    const el=document.getElementById(rg.id),ne=document.getElementById(rg.lbl);
    if(!el||!ne)return;
    gsap.fromTo({v:0},{v:rg.pct},{duration:.85,delay:.06+i*.06,ease:'power2.out',
      onUpdate:function(){const v=this.targets()[0].v,f=C*(v/100),g=C-f;el.setAttribute('stroke-dasharray',`${f} ${g}`);ne.textContent=Math.round(v)+'%';},
      onComplete:()=>{el.setAttribute('stroke-dasharray',`${C*(rg.pct/100)} ${C*(1-rg.pct/100)}`);ne.textContent=rg.pct+'%';}});
  });
  // cards stagger
  gsap.fromTo('.tc',{opacity:0,y:7},{opacity:1,y:0,duration:.26,stagger:.05,ease:'power2.out',delay:.16});
  gsap.fromTo('.hring',{opacity:0,x:10},{opacity:1,x:0,duration:.28,stagger:.06,ease:'power2.out',delay:.12});
}
window.addEventListener('load',()=>{
  gsap.fromTo('#lcard',{opacity:0,y:20,scale:.97},{opacity:1,y:0,scale:1,duration:.65,ease:'power3.out',delay:.2});
});
</script>
