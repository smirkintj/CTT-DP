<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTT — Change Tracking Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#c4161c;--brand-dk:#9b1117;--brand-lt:#fee2e2;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;
  --s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;
  --s800:#1e293b;--s900:#0f172a;
  --em:#10b981;--bl:#3b82f6;--am:#f59e0b;--ro:#f43f5e;--vi:#8b5cf6;--in:#6366f1;
  --r:12px;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--s50);color:var(--s900);line-height:1.5}
body{overflow:hidden}

/* PAGE SYSTEM */
.page{position:absolute;inset:0;display:none}
.page.active{display:block}

/* ══════════════════════════════════════
   LOGIN
══════════════════════════════════════ */
#pg-login{background:var(--s900);display:flex;align-items:center;justify-content:center;overflow:hidden}
#pg-login.active{display:flex}
#c3{position:absolute;inset:0;opacity:.5}
.l-noise{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");pointer-events:none}
.l-glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(196,22,28,.2) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none}

.lcard{
  position:relative;z-index:10;width:400px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:44px;
  backdrop-filter:blur(28px);
  box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
}
.l-brand{display:flex;align-items:center;gap:12px;margin-bottom:38px}
.l-icon{width:38px;height:38px;background:var(--brand);border-radius:10px;display:grid;place-items:center}
.l-icon svg{width:19px;height:19px}
.l-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.01em}
.l-sub{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.l-h{font-size:25px;font-weight:700;color:#fff;letter-spacing:-.03em;margin-bottom:5px}
.l-p{font-size:13px;color:rgba(255,255,255,.38);margin-bottom:30px}
.lbl{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.inp{width:100%;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:rgba(255,255,255,.18)}
.inp:focus{border-color:rgba(196,22,28,.5);box-shadow:0 0 0 3px rgba(196,22,28,.1)}
.fg{margin-bottom:16px}
.lbtn{width:100%;padding:12px;background:var(--brand);border:none;border-radius:10px;font-size:13.5px;font-weight:600;font-family:inherit;color:#fff;cursor:pointer;margin-top:8px;transition:background .15s,transform .12s,box-shadow .15s;box-shadow:0 4px 18px rgba(196,22,28,.38);letter-spacing:-.01em}
.lbtn:hover{background:var(--brand-dk);transform:translateY(-1px);box-shadow:0 8px 24px rgba(196,22,28,.45)}
.lbtn:active{transform:translateY(0)}
.l-hint{margin-top:18px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.18)}
.l-hint span{color:rgba(255,255,255,.4)}
.dpills{display:flex;gap:6px;margin-top:22px;border-top:1px solid rgba(255,255,255,.06);padding-top:18px}
.dp{flex:1;padding:7px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;text-align:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.32);cursor:pointer;transition:all .15s}
.dp:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.68);border-color:rgba(255,255,255,.14)}
.dp .dr{display:block;font-size:9.5px;color:rgba(255,255,255,.2);margin-top:1px}

/* ══════════════════════════════════════
   APP — TOP NAV (matches production)
══════════════════════════════════════ */
#pg-app{overflow:hidden}
#pg-app.active{display:flex;flex-direction:column}

.topnav{
  height:60px;flex-shrink:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--s200);
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;
  padding:0 28px;gap:0;
}
.tn-logo{display:flex;align-items:center;gap:9px;margin-right:32px;text-decoration:none;cursor:pointer}
.tn-logo-box{width:30px;height:30px;background:var(--brand);border-radius:7px;display:grid;place-items:center;transition:background .15s}
.tn-logo-box:hover,.tn-logo:hover .tn-logo-box{background:var(--brand-dk)}
.tn-logo-box svg{width:15px;height:15px}
.tn-logo-text{font-size:14px;font-weight:700;color:var(--s900);letter-spacing:-.01em}
.tn-nav{display:flex;align-items:center;gap:2px;flex:1}
.tn-item{padding:7px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--s500);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.tn-item:hover{color:var(--s800);background:var(--s50)}
.tn-item.active{color:var(--brand);background:var(--brand-lt);font-weight:600}
.tn-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tn-bell{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:background .15s;position:relative;border:1px solid var(--s200)}
.tn-bell:hover{background:var(--s50)}
.tn-bell svg{width:16px;height:16px;stroke:var(--s500)}
.tn-bell-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;background:var(--brand);border-radius:50%;border:2px solid #fff}
.tn-div{width:1px;height:22px;background:var(--s200)}
.tn-user{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;cursor:pointer;transition:background .15s}
.tn-user:hover{background:var(--s50)}
.tn-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand) 0%,#7c0e12 100%);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid var(--s200)}
.tn-uname{font-size:12.5px;font-weight:600;color:var(--s800)}
.tn-urole{font-size:10.5px;color:var(--s400)}
.env-chip{padding:3px 8px;background:#fef9c3;border:1px solid #fde047;border-radius:6px;font-size:10px;font-weight:600;color:#713f12;letter-spacing:.04em}

/* CONTENT AREA */
.app-body{flex:1;overflow-y:auto;padding:32px 28px}
.app-body::-webkit-scrollbar{width:6px}
.app-body::-webkit-scrollbar-thumb{background:var(--s200);border-radius:3px}

/* ══════════════════════════════════════
   PAGE: ADMIN DASHBOARD
══════════════════════════════════════ */

/* Page header */
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.pg-head-left h1{font-size:24px;font-weight:800;color:var(--s900);letter-spacing:-.04em;line-height:1}
.pg-head-left p{font-size:13px;color:var(--s400);margin-top:4px}
.btn-new{height:36px;padding:0 16px;background:var(--s900);border:none;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s;letter-spacing:-.01em}
.btn-new:hover{background:var(--s800)}
.btn-new svg{width:14px;height:14px;stroke:#fff;stroke-width:2.5}

/* Sprint progress card */
.sprint-card{
  background:#fff;
  border:1px solid var(--s200);
  border-radius:16px;
  padding:22px 26px;
  margin-bottom:22px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.sprint-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sprint-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--s400)}
.sprint-title{font-size:15px;font-weight:700;color:var(--s900);letter-spacing:-.02em}
.sprint-right{display:flex;align-items:center;gap:16px}
.sprint-stat{text-align:right}
.sprint-stat-val{font-size:20px;font-weight:800;color:var(--s900);letter-spacing:-.04em;line-height:1}
.sprint-stat-lbl{font-size:10.5px;color:var(--s400);margin-top:1px}
.sprint-pct{font-size:32px;font-weight:800;color:var(--s900);letter-spacing:-.06em;line-height:1}
.sprint-pct sup{font-size:14px;font-weight:600;color:var(--s500);letter-spacing:0}
/* Stacked progress bar */
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:14px}
.sb-seg{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.16,1,.3,1)}
/* Legend row */
.sbar-legend{display:flex;flex-wrap:wrap;gap:14px}
.sbl{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--s600)}
.sbl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.sbl strong{font-weight:700;color:var(--s900);margin-left:2px}

/* Product readiness cards */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.prod-card{
  background:#fff;border:1px solid var(--s200);border-radius:16px;
  padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.04);
  cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.prod-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.09);transform:translateY(-2px);border-color:var(--s300)}
.prod-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.prod-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.prod-icon svg{width:17px;height:17px}
.prod-blocked-chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
/* Ring + number */
.prod-ring-wrap{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.prod-ring{position:relative;flex-shrink:0}
.prod-ring svg{display:block}
.prod-ring-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;letter-spacing:-.04em;color:var(--s900);line-height:1}
.prod-stats{flex:1}
.prod-name{font-size:14px;font-weight:700;color:var(--s900);letter-spacing:-.02em;margin-bottom:6px}
.prod-code{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--s400);margin-bottom:10px}
.prod-meta-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--s500);margin-bottom:3px}
.prod-meta-row svg{width:11px;height:11px;flex-shrink:0}
.prod-meta-row strong{color:var(--s800);font-weight:600}
/* Country chips */
.ctry-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.ctry{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.03em}
.c-MY{background:#dbeafe;color:#1e40af}
.c-SG{background:#cffafe;color:#155e75}
.c-TH{background:#fce7f3;color:#9d174d}
.c-VN{background:#fef9c3;color:#713f12}
.c-TW{background:#d1fae5;color:#065f46}
.c-HK{background:#fee2e2;color:#991b1b}

/* ══════════════════════════════════════
   BOTTOM: tasks + activity 2-col
══════════════════════════════════════ */
.dash-bottom{display:grid;grid-template-columns:1fr 320px;gap:18px}

/* Section header */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-h-l{display:flex;align-items:center;gap:8px}
.sec-title{font-size:13.5px;font-weight:700;color:var(--s900);letter-spacing:-.02em}
.sec-count{font-size:11px;font-weight:600;color:var(--s400);background:var(--s100);padding:2px 8px;border-radius:20px}
.sec-link{font-size:12px;font-weight:500;color:var(--s400);cursor:pointer;transition:color .15s}
.sec-link:hover{color:var(--s700)}

/* Filters */
.fbar{display:flex;gap:7px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.fsel{border:1px solid var(--s200);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;color:var(--s600);background:#fff;cursor:pointer;outline:none}
.fsel:focus{border-color:var(--s400)}

/* Task cards (faithful to production style, elevated) */
.tc{
  background:#fff;border:1px solid var(--s200);border-radius:12px;
  padding:16px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  cursor:pointer;position:relative;overflow:hidden;
  transition:box-shadow .2s,border-color .2s,transform .15s;
}
.tc:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:var(--s300);transform:translateY(-1px)}
.tc-bar{position:absolute;top:0;left:0;right:0;height:3px}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.tc-title{font-size:13.5px;font-weight:600;color:var(--s900);line-height:1.35;flex:1}
.tc-desc{font-size:12px;color:var(--s500);margin-bottom:8px;line-height:1.4}
.tc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tc-foot{border-top:1px solid var(--s100);padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tc-assignee{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--s600)}
.tc-av{width:20px;height:20px;border-radius:50%;background:var(--s700);display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;flex-shrink:0}
.tc-due{font-size:11.5px;display:flex;align-items:center;gap:4px}
.tc-due svg{width:12px;height:12px}
.overdue-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#dc2626;background:#fee2e2;padding:2px 6px;border-radius:20px;margin-left:4px}
.jira-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:2px 6px;border-radius:4px}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.badge-dot{width:5px;height:5px;border-radius:50%}
.bs-PASSED{background:#d1fae5;color:#065f46}.bs-PASSED .badge-dot{background:var(--em)}
.bs-FAILED{background:#fee2e2;color:#991b1b}.bs-FAILED .badge-dot{background:var(--ro)}
.bs-BLOCKED{background:#fef3c7;color:#92400e}.bs-BLOCKED .badge-dot{background:var(--am)}
.bs-IN_PROGRESS{background:#dbeafe;color:#1e40af}.bs-IN_PROGRESS .badge-dot{background:var(--bl)}
.bs-READY{background:var(--s100);color:var(--s600)}.bs-READY .badge-dot{background:var(--s400)}
.bs-DEPLOYED{background:#e0e7ff;color:#3730a3}.bs-DEPLOYED .badge-dot{background:var(--in)}
.bs-DRAFT{background:var(--s100);color:var(--s500)}
.bp-HIGH{background:#fee2e2;color:#991b1b}
.bp-MEDIUM{background:#fef3c7;color:#92400e}
.bp-LOW{background:var(--s100);color:var(--s500)}
.bm{background:#eef2ff;color:#3730a3;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.bprod{background:#ecfdf5;color:#065f46;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}

/* View all */
.view-all-btn{width:100%;padding:10px;border:1.5px dashed var(--s200);border-radius:10px;background:transparent;font-size:12.5px;font-weight:500;color:var(--s400);cursor:pointer;transition:all .15s;font-family:inherit}
.view-all-btn:hover{background:var(--s50);color:var(--s700);border-color:var(--s300)}

/* Activity feed */
.act-card{background:#fff;border:1px solid var(--s200);border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.act-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--s50);align-items:flex-start}
.act-item:last-child{border-bottom:none;padding-bottom:0}
.act-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.act-ico svg{width:13px;height:13px}
.ai-signed{background:#d1fae5}.ai-signed svg{stroke:var(--em)}
.ai-blocked{background:#fef3c7}.ai-blocked svg{stroke:var(--am)}
.ai-comment{background:#dbeafe}.ai-comment svg{stroke:var(--bl)}
.ai-failed{background:#fee2e2}.ai-failed svg{stroke:var(--ro)}
.ai-status{background:#e0e7ff}.ai-status svg{stroke:var(--in)}
.act-body{flex:1;min-width:0}
.act-txt{font-size:12px;color:var(--s600);line-height:1.45}
.act-txt strong{color:var(--s900);font-weight:600}
.act-time{font-size:10.5px;color:var(--s400);margin-top:2px}

/* Critical issues side widget */
.ci-card{background:#fff;border:1px solid var(--s200);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ci-item{display:flex;gap:9px;padding:9px 10px;background:#fff8f8;border:1px solid #fee2e2;border-radius:9px;margin-bottom:7px;cursor:pointer;transition:background .15s}
.ci-item:last-child{margin-bottom:0}
.ci-item:hover{background:#fee2e2}
.ci-item svg{width:14px;height:14px;stroke:var(--ro);flex-shrink:0;margin-top:1px}
.ci-title{font-size:12px;font-weight:600;color:#991b1b;line-height:1.3}
.ci-meta{font-size:10.5px;color:#dc2626;margin-top:2px}

</style>
</head>
<body>

<!-- ═══════════════════════════
     LOGIN
═══════════════════════════ -->
<div id="pg-login" class="page active">
  <canvas id="c3"></canvas>
  <div class="l-noise"></div>
  <div class="l-glow"></div>
  <div class="lcard" id="lcard">
    <div class="l-brand">
      <div class="l-icon">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="9" height="2" rx="1" fill="white"/><rect x="2" y="8" width="13" height="2" rx="1" fill="white"/><rect x="2" y="13" width="7" height="2" rx="1" fill="white"/><polyline points="12,10 14.5,13 18.5,8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div><div class="l-name">CTT</div><div class="l-sub">DKSH Change Tracking</div></div>
    </div>
    <h1 class="l-h">Welcome back</h1>
    <p class="l-p">Sign in to track UAT &amp; SIT across markets</p>
    <div class="fg"><label class="lbl">Email address</label><input class="inp" type="email" value="putra.mahirudin@dksh.com"></div>
    <div class="fg"><label class="lbl">Password</label><input class="inp" type="password" value="••••••••••"></div>
    <button class="lbtn" onclick="enterApp()">Sign in to CTT</button>
    <div class="dpills">
      <div class="dp" onclick="enterApp('admin')">Putra M.<span class="dr">Admin</span></div>
      <div class="dp" onclick="enterApp('stakeholder')">UAT MY<span class="dr">Stakeholder</span></div>
      <div class="dp" onclick="enterApp('qa')">QA EO<span class="dr">QA</span></div>
    </div>
    <p class="l-hint">v1.4.2 · <span>Staging environment</span></p>
  </div>
</div>

<!-- ═══════════════════════════
     APP
═══════════════════════════ -->
<div id="pg-app" class="page">
  <!-- TOP NAV -->
  <nav class="topnav">
    <div class="tn-logo" onclick="navTo('admin-dashboard')">
      <div class="tn-logo-box">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="9" height="2" rx="1" fill="white"/><rect x="2" y="8" width="13" height="2" rx="1" fill="white"/><rect x="2" y="13" width="7" height="2" rx="1" fill="white"/><polyline points="12,10 14.5,13 18.5,8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="tn-logo-text">CTT</span>
    </div>

      This page is part of the next batch of mockups.<br>
      Currently included: <strong>Login</strong> and <strong>Admin Dashboard</strong>.
    </div>
  </div>
</div>
</template>

<script>
// ─── THREE.JS LOGIN BACKGROUND ───────────────────────────────────────────────
(function(){
  const canvas=document.getElementById('c3');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,1,0.1,100);
  camera.position.z=28;
  const N=75,pos=[],vel=[];
  const pArr=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos.push({x:(Math.random()-.5)*56,y:(Math.random()-.5)*38,z:(Math.random()-.5)*8});
    vel.push({x:(Math.random()-.5)*.038,y:(Math.random()-.5)*.038});
  }
  const pGeo=new THREE.BufferGeometry();
  const pMat=new THREE.PointsMaterial({color:0xc4161c,size:.22,transparent:true,opacity:.75});
  const pts=new THREE.Points(pGeo,pMat);
  scene.add(pts);
  const lMat=new THREE.LineBasicMaterial({color:0xc4161c,transparent:true,opacity:.11});
  const lGeo=new THREE.BufferGeometry();
  const lArr=new Float32Array(N*N*6);
  lGeo.setAttribute('position',new THREE.BufferAttribute(lArr,3));
  const lines=new THREE.LineSegments(lGeo,lMat);
  scene.add(lines);
  let mouse={x:0,y:0};
  window.addEventListener('mousemove',e=>{mouse.x=(e.clientX/innerWidth-.5)*.4;mouse.y=(e.clientY/innerHeight-.5)*.4;});
  function resize(){renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize);resize();
  let lc=0;const D=13;
  function tick(){
    if(!document.getElementById('pg-login').classList.contains('active'))return;
    requestAnimationFrame(tick);
    camera.position.x+=(mouse.x*3.5-camera.position.x)*.02;
    camera.position.y+=(-mouse.y*2.5-camera.position.y)*.02;
    for(let i=0;i<N;i++){
      pos[i].x+=vel[i].x;pos[i].y+=vel[i].y;
      if(Math.abs(pos[i].x)>30)vel[i].x*=-1;
      if(Math.abs(pos[i].y)>20)vel[i].y*=-1;
      pArr[i*3]=pos[i].x;pArr[i*3+1]=pos[i].y;pArr[i*3+2]=pos[i].z;
    }
    pGeo.setAttribute('position',new THREE.BufferAttribute(pArr.slice(),3));
    lc=0;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y;
      if(dx*dx+dy*dy<D*D){
        lArr[lc++]=pos[i].x;lArr[lc++]=pos[i].y;lArr[lc++]=pos[i].z;
        lArr[lc++]=pos[j].x;lArr[lc++]=pos[j].y;lArr[lc++]=pos[j].z;
      }
    }
    lGeo.attributes.position.needsUpdate=true;
    lGeo.setDrawRange(0,lc/3);
    renderer.render(scene,camera);
  }
  tick();window._tick=tick;
})();

// ─── APP STATE ────────────────────────────────────────────────────────────────
const ROLES={
  admin:{name:'Putra Mahirudin',initials:'PM',role:'Administrator',
    nav:['Dashboard','Tasks','JIRA Queue','AI Drafts','Config'],
    ids:['admin-dashboard','tasks','jira-intake','draft-tasks','database']},
  stakeholder:{name:'Radzwan Noh',initials:'RN',role:'Stakeholder · MY',
    nav:['Dashboard','Inbox','Knowledge Base'],
    ids:['stakeholder-dashboard','inbox','knowledge-base']},
  qa:{name:'QA Engineer',initials:'QE',role:'QA · EasyOrder',
    nav:['QA Dashboard','JIRA Queue','SIT Tasks'],
    ids:['qa-dashboard','qa-jira','qa-sit']}
};
let curRole='admin',roles=['admin','stakeholder','qa'],roleIdx=0;

function buildNav(role){
  const cfg=ROLES[role];
  const nav=document.getElementById('tn-nav');
  nav.innerHTML=cfg.nav.map((n,i)=>
    `<div class="tn-item${i===0?' active':''}" data-id="${cfg.ids[i]}" onclick="navTo('${cfg.ids[i]}')">${n}</div>`
  ).join('');
}

function enterApp(role='admin'){
  curRole=role;
  const lp=document.getElementById('pg-login');
  const ap=document.getElementById('pg-app');
  gsap.to(lp,{opacity:0,duration:.45,onComplete:()=>{
    lp.classList.remove('active');
    ap.classList.add('active');
    const cfg=ROLES[role];
    document.getElementById('ua').textContent=cfg.initials;
    document.getElementById('un').textContent=cfg.name;
    document.getElementById('ur').textContent=cfg.role;
    buildNav(role);
    navTo(ROLES[role].ids[0]);
    gsap.fromTo(ap,{opacity:0},{opacity:1,duration:.35});
  }});
}

function cycleRole(){
  roleIdx=(roleIdx+1)%roles.length;
  const r=roles[roleIdx];
  curRole=r;
  const cfg=ROLES[r];
  document.getElementById('ua').textContent=cfg.initials;
  document.getElementById('un').textContent=cfg.name;
  document.getElementById('ur').textContent=cfg.role;
  buildNav(r);
  navTo(ROLES[r].ids[0]);
}

function navTo(id){
  document.querySelectorAll('.tn-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  const body=document.getElementById('app-body');
  const tpl=document.getElementById('t-'+id)||document.getElementById('t-admin-dashboard');
  const isStub=!document.getElementById('t-'+id);
  gsap.to(body,{opacity:0,y:6,duration:.12,onComplete:()=>{
    body.innerHTML=tpl.innerHTML;
    if(isStub){
      const st=body.querySelector('#stub-title');
      if(st)st.textContent=id.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    }
    animateDashboard();
    gsap.fromTo(body,{opacity:0,y:10},{opacity:1,y:0,duration:.28,ease:'power2.out'});
  }});
}

// ─── DASHBOARD ANIMATIONS ────────────────────────────────────────────────────
function animateDashboard(){
  // Stacked bar segments
  document.querySelectorAll('.sb-seg[data-w]').forEach(el=>{
    gsap.fromTo(el,{width:'0%'},{width:el.dataset.w+'%',duration:1.1,ease:'power3.out',delay:.15});
  });
  // Counter
  document.querySelectorAll('[data-count]').forEach(el=>{
    const t=parseInt(el.dataset.count);
    gsap.fromTo({v:0},{v:t},{duration:.9,ease:'power2.out',
      onUpdate:function(){el.textContent=Math.round(this.targets()[0].v);},
      onComplete:()=>{el.textContent=t;}});
  });
  // Product rings (circumference for r=34 = 213.6)
  const rings=[
    {id:'ring-eo',pct:74,pctEl:'pct-eo'},
    {id:'ring-sh',pct:61,pctEl:'pct-sh'},
    {id:'ring-sp',pct:88,pctEl:'pct-sp'},
  ];
  const C=213.6;
  rings.forEach((r,i)=>{
    const el=document.getElementById(r.id);
    const pEl=document.getElementById(r.pctEl);
    if(!el||!pEl)return;
    const filled=C*(r.pct/100);
    const gap=C-filled;
    gsap.fromTo({v:0},{v:r.pct},{duration:.9,delay:.1+i*.08,ease:'power2.out',
      onUpdate:function(){
        const v=this.targets()[0].v;
        const f=C*(v/100),g=C-f;
        el.setAttribute('stroke-dasharray',`${f} ${g}`);
        pEl.textContent=Math.round(v)+'%';
      },
      onComplete:()=>{
        el.setAttribute('stroke-dasharray',`${filled} ${gap}`);
        pEl.textContent=r.pct+'%';
      }
    });
  });
  // Card stagger
  gsap.fromTo('.tc',{opacity:0,y:10},{opacity:1,y:0,duration:.3,stagger:.06,ease:'power2.out',delay:.2});
  gsap.fromTo('.prod-card',{opacity:0,y:12},{opacity:1,y:0,duration:.35,stagger:.07,ease:'power2.out',delay:.05});
}

// ─── LOGIN ENTRANCE ──────────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  gsap.fromTo('#lcard',{opacity:0,y:22,scale:.97},{opacity:1,y:0,scale:1,duration:.65,ease:'power3.out',delay:.2});
});
</script>
</body>
</html>
